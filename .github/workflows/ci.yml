name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, unit tests, database security, end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies migrations)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit

      - name: Database security tests
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/db/security.test.sql

      - name: Export local Supabase keys
        run: |
          supabase status -o env > .sb.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' .sb.env | cut -d= -f2- | tr -d '\"')" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' .sb.env | cut -d= -f2- | tr -d '\"')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' .sb.env | cut -d= -f2- | tr -d '\"')" >> $GITHUB_ENV
          echo "CRON_SECRET=ci-secret" >> $GITHUB_ENV

      - name: Production build
        run: npm run build

      - name: Seed two test accounts and pair them
        run: |
          node tests/e2e/seed.mjs
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 \
            -c "select public.setup_pair('nova@test.local','Nova','night@test.local','Night');"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: npx playwright test

      - name: Cleanup job works against real Storage
        run: |
          npm run start -- -p 3100 & sleep 8
          curl -fsS -H "Authorization: Bearer ci-secret" http://localhost:3100/api/cleanup

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
